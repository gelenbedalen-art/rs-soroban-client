name: fork-tests
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustfmt --edition 2021 --check src/transaction.rs
      - run: cargo test --lib
      - run: cargo clippy --lib --tests
